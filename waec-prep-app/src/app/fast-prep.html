<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fast Exam Prep — D'WAINZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="dw-shell">
  <div class="dw-topbar">
    <a class="dw-brand" href="index.html"><span class="mark">D</span><span class="name">D'WAINZ</span></a>
    <nav class="dw-nav">
      <a href="index.html">Study</a>
      <a href="fast-prep.html" class="active">Fast Exam Prep</a>
    </nav>
  </div>

  <div class="dw-hero">
    <div class="dw-eyebrow" id="subjectLabel">Fast Exam Prep</div>
    <h1 class="dw-h1">Past questions, by topic</h1>
    <p class="dw-lede">Pick a topic to see every past question we have for it — the year, the answer, and a direct link back to the exact lesson card that explains it.</p>
    <div id="placeholderBanner" hidden>
      <span class="dw-badge placeholder">⚠ Placeholder data</span>
      <p class="dw-lede" style="margin-top:6px; font-size:13px;" id="placeholderText"></p>
    </div>
  </div>

  <div id="content"></div>

  <div class="dw-footer">D'WAINZ · WAEC &amp; JAMB Fast Exam Prep.</div>
</div>

<script src="shared.js"></script>
<script>
  var subjectId = Dwainz.qs('subject') || 'biology';
  var focusTopicId = Dwainz.qs('topic');

  Promise.all([Dwainz.loadSubject(subjectId), Dwainz.loadPastQuestions(subjectId)]).then(function (results) {
    var subjectData = results[0], pastData = results[1];
    document.getElementById('subjectLabel').textContent = subjectData.subjectTitle + ' · Fast Exam Prep';

    if (pastData.placeholder) {
      document.getElementById('placeholderBanner').hidden = false;
      document.getElementById('placeholderText').textContent = pastData.disclaimer;
    }

    var content = document.getElementById('content');

    subjectData.topics.forEach(function (topic) {
      var topicQs = pastData.topics[topic.id];
      if (!topicQs) return; // no past-question bank for this topic yet

      var topicWrap = document.createElement('div');
      topicWrap.style.marginTop = '18px';
      var tColor = Dwainz.topicColor(subjectData.topics.indexOf(topic));
      topicWrap.style.setProperty('--topic-accent', tColor.accent);
      var totalQCount = Object.keys(topicQs).reduce(function (n, k) { return n + topicQs[k].length; }, 0);
      topicWrap.innerHTML = '<p class="dw-section-title" style="border-left:4px solid ' + tColor.accent + '; padding-left:8px;">' + topic.title + ' · ' + totalQCount + ' questions across ' + Object.keys(topicQs).length + ' sub-topics</p>';

      topic.subtopics.forEach(function (sub) {
        var qs = topicQs[sub.id];
        if (!qs || !qs.length) return;

        var details = document.createElement('details');
        details.className = 'dw-accordion';
        details.id = sub.id;
        if (focusTopicId === topic.id) details.open = true;

        var summary = document.createElement('summary');
        summary.textContent = sub.title + ' (' + qs.length + ')';
        details.appendChild(summary);

        qs.forEach(function (q) {
          var card = document.createElement('div');
          card.className = 'dw-qcard';
          card.style.setProperty('--topic-accent', tColor.accent);
          var correctIdx = q.answer.charCodeAt(0) - 65;
          var optionsHtml = q.options.map(function (opt, i) {
            var letter = String.fromCharCode(65 + i);
            return '<button type="button" class="opt" data-idx="' + i + '">' + letter + '. ' + opt + '</button>';
          }).join('');
          var refCard = q.ref && q.ref.card;
          var reviewHref = 'study.html?subject=' + subjectId + '&topic=' + topic.id + '&subtopic=' + sub.id + '&card=' + refCard + '&from=fastprep';
          card.innerHTML =
            '<div class="qmeta"><span>' + q.year + '</span><span>' + (q.paper || '') + '</span></div>' +
            '<p class="qtext">' + q.question + '</p>' +
            '<p class="attempt-hint">Tap an option to answer</p>' +
            '<div class="opts" data-correct="' + correctIdx + '">' + optionsHtml + '</div>' +
            '<details class="explain-details" data-locked="1"><summary>🔒 Answer first to unlock the explanation</summary><p class="explain">' + q.explanation + '</p></details>' +
            (refCard ? '<a class="reviewlink" href="' + reviewHref + '">→ Review the lesson card that explains this</a>' : '');
          details.appendChild(card);
        });

        topicWrap.appendChild(details);
      });

      content.appendChild(topicWrap);
    });

    if (window.location.hash) {
      var target = document.getElementById(window.location.hash.slice(1));
      if (target) { target.open = true; target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }

    content.addEventListener('click', function (e) {
      var btn = e.target.closest('.dw-qcard .opts .opt');
      if (!btn) return;
      var group = btn.closest('.opts');
      if (group.dataset.answered) return;
      group.dataset.answered = '1';
      var correctIdx = parseInt(group.dataset.correct, 10);
      var chosenIdx = parseInt(btn.dataset.idx, 10);
      var hint = group.previousElementSibling;
      if (hint && hint.classList.contains('attempt-hint')) {
        hint.textContent = chosenIdx === correctIdx ? 'Correct ✓' : 'Not quite — correct answer highlighted';
      }
      Array.prototype.forEach.call(group.querySelectorAll('.opt'), function (o, i) {
        o.disabled = true;
        if (i === correctIdx) o.classList.add('correct');
      });
      if (chosenIdx !== correctIdx) btn.classList.add('wrong');

      var details = group.closest('.dw-qcard').querySelector('.explain-details');
      if (details) {
        details.removeAttribute('data-locked');
        details.querySelector('summary').textContent = 'Show explanation';
      }
    });
  }).catch(function (err) {
    document.getElementById('content').textContent = 'Could not load exam prep data.';
    console.error(err);
  });
</script>
</body>
</html>
