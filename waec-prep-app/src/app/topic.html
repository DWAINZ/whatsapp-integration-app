<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topic — D'WAINZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="dw-shell">
  <div class="dw-topbar">
    <a class="dw-brand" href="index.html"><span class="mark">D</span><span class="name">D'WAINZ</span></a>
    <nav class="dw-nav">
      <a href="index.html">Study</a>
      <a href="fast-prep.html">Fast Exam Prep</a>
    </nav>
  </div>

  <div class="dw-crumbs" id="crumbs"></div>

  <div class="dw-hero">
    <div class="dw-eyebrow" id="subjectLabel">Subject</div>
    <h1 class="dw-h1" id="topicTitle">Loading…</h1>
    <p class="dw-lede" id="topicDesc"></p>
  </div>

  <div>
    <p class="dw-section-title">Sub-topics</p>
    <div class="dw-list" id="subtopicList" style="margin-top:10px;"></div>
  </div>

  <div id="certZone" hidden>
    <p class="dw-section-title">Certificate</p>
    <div class="dw-panel" style="margin-top:10px; align-items:center;">
      <div class="dw-cert-inline" id="certPrintArea">
        <div class="wm">D&rsquo;WAINZ</div>
        <div class="inner">
          <div class="seal">🏅</div>
          <div class="title">Certificate of Completion</div>
          <p class="line">This certifies that</p>
          <input id="certName" type="text" placeholder="Type your name" />
          <p class="line">has completed</p>
          <div class="program" id="certProgram"></div>
          <p class="line">on the D'WAINZ Deep Understanding Track</p>
          <p class="line" id="certDate"></p>
          <div class="byline">By D'WAINZ</div>
        </div>
      </div>
      <div class="dw-cert-actions" style="display:flex; gap:8px; margin-top:6px;">
        <button class="dw-card" id="printCertBtn" style="cursor:pointer; padding:9px 16px;">🖨 Print / Save Certificate</button>
      </div>
    </div>
  </div>

  <div class="dw-footer">D'WAINZ · Built for Nigerian WAEC &amp; JAMB students.</div>
</div>

<script src="shared.js"></script>
<script>
  var subjectId = Dwainz.qs('subject') || 'biology';
  var topicId = Dwainz.qs('topic');

  Dwainz.loadSubject(subjectId).then(function (data) {
    document.getElementById('subjectLabel').textContent = data.subjectTitle;
    document.getElementById('crumbs').innerHTML = '<a href="index.html">Study</a> <span>/</span> <span>' + data.subjectTitle + '</span>';

    var topic = topicId ? Dwainz.findTopic(data, topicId) : (data.topics[0]);
    if (!topic) { document.getElementById('topicTitle').textContent = 'Topic not found'; return; }

    document.title = topic.title + ' — D’WAINZ';
    document.getElementById('topicTitle').textContent = topic.title;
    document.getElementById('topicDesc').textContent = topic.description || '';
    document.getElementById('crumbs').innerHTML += ' <span>/</span> <span>' + topic.title + '</span>';

    var progress = Dwainz.getTopicProgress(subjectId, topic.id);
    var listEl = document.getElementById('subtopicList');
    var allDone = topic.subtopics.length > 0;

    topic.subtopics.forEach(function (sub, i) {
      var done = progress[sub.id] && progress[sub.id].done;
      if (!done) allDone = false;
      var row = document.createElement('a');
      row.className = 'dw-row';
      row.href = 'study.html?subject=' + subjectId + '&topic=' + topic.id + '&subtopic=' + sub.id;
      var scoreText = done ? (progress[sub.id].correct + '/' + progress[sub.id].total + ' correct') : ((sub.lessons.length + sub.stories.length) + ' cards');
      row.innerHTML =
        '<span class="title">' + (done ? '<span class="check">✓</span>' : '') + (i + 1) + '. ' + sub.title + '</span>' +
        '<span class="meta" style="font:600 11px \'IBM Plex Mono\',monospace; color:var(--dim);">' + scoreText + ' <span class="arrow">→</span></span>';
      listEl.appendChild(row);
    });

    if (allDone) {
      document.getElementById('certZone').hidden = false;
      document.getElementById('certProgram').textContent = topic.title;
      document.getElementById('certDate').textContent = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
    }

    document.getElementById('printCertBtn').addEventListener('click', function () {
      var name = document.getElementById('certName').value.trim() || 'A Dedicated Learner';
      var date = document.getElementById('certDate').textContent;
      var html = '<!doctype html><html><head><meta charset="utf-8"><title>Certificate — ' + name + '</title>' +
        '<style>body{margin:0;padding:48px;font-family:Georgia,serif;background:#fff;color:#16202B;display:flex;align-items:center;justify-content:center;min-height:100vh;}' +
        '.wrap{position:relative;overflow:hidden;max-width:640px;width:100%;border:3px solid #2E8FE0;border-radius:14px;padding:56px 40px;text-align:center;}' +
        '.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:900;color:rgba(46,143,224,.10);transform:rotate(-18deg);white-space:nowrap;pointer-events:none;}' +
        '.inner{position:relative;z-index:1;} .seal{font-size:44px;} .title{font-size:30px;font-weight:700;margin:8px 0;} .line{color:#5B6B78;font-size:14px;margin:4px 0;}' +
        '.name{font-size:28px;font-weight:700;color:#1C6FB8;border-bottom:2px solid #2E8FE0;display:inline-block;padding:0 10px 6px;margin:8px 0;}' +
        '.program{font-size:18px;font-weight:700;margin:6px 0 0;} .date{color:#8A94A0;font-size:12px;margin-top:10px;}' +
        '.byline{margin-top:22px;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:#1C6FB8;font-family:monospace;}' +
        '.hint{margin-top:28px;font-family:sans-serif;font-size:12px;color:#8A94A0;} .hint button{margin-top:8px;padding:8px 16px;border-radius:20px;border:1px solid #2E8FE0;background:#2E8FE0;color:#fff;font-family:sans-serif;font-size:12.5px;cursor:pointer;}' +
        '@media print{.hint{display:none;}}</style></head><body>' +
        '<div class="wrap"><div class="wm">D’WAINZ</div><div class="inner">' +
        '<div class="seal">🏅</div><div class="title">Certificate of Completion</div><p class="line">This certifies that</p>' +
        '<div class="name">' + name + '</div><p class="line">has completed</p>' +
        '<div class="program">' + topic.title + '</div><p class="line">Deep Understanding Track</p>' +
        '<div class="date">' + date + '</div><div class="byline">By D’WAINZ</div></div></div>' +
        '<div class="hint">In the print dialog, choose "Save as PDF" as the destination.<br><button onclick="window.print()">🖶 Print / Save as PDF</button></div>' +
        '<script>window.onload=function(){setTimeout(function(){window.print();},250);};<' + '/script>' +
        '</body></html>';
      var w = window.open('', '_blank');
      if (!w) { alert('Please allow pop-ups for this page, then click Print again.'); return; }
      w.document.open(); w.document.write(html); w.document.close();
    });
  }).catch(function (err) {
    document.getElementById('topicTitle').textContent = 'Could not load this subject';
    console.error(err);
  });
</script>
</body>
</html>
